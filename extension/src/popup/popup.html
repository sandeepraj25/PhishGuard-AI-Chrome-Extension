<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PhishGuard</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>PhishGuard</h1>
        <span id="plan" class="plan"></span>
      </header>
      <section id="site" aria-live="polite">
        <div class="domain" id="domain">Checking…</div>
        <div class="meter" role="meter" aria-valuemin="0" aria-valuemax="100" id="meter">
          <div class="fill" id="fill"></div>
        </div>
        <div class="verdict" id="verdict"></div>
        <ul id="reasons" class="reasons"></ul>
        <div class="row">
          <button id="trust" type="button">I trust this site</button>
          <button id="report" type="button">Report mistake</button>
        </div>
        <div id="status" class="status" role="status"></div>
      </section>
      <details id="trusted-box">
        <summary>Trusted sites (<span id="trusted-count">0</span>)</summary>
        <ul id="trusted" class="trusted"></ul>
      </details>
      <details id="plan-box">
        <summary>Plan: <span id="plan-name">Free</span></summary>
        <p class="fine" id="plan-detail">
          Free includes the URL check, the password warning, reasons and regional brands. Pro adds page and visual
          look-alike checks.
        </p>
        <div id="free-actions">
          <label class="fine" for="license-key">Licence key</label>
          <div class="row">
            <input id="license-key" type="text" autocomplete="off" spellcheck="false" placeholder="PG1…" />
            <button id="activate" type="button">Activate</button>
          </div>
          <button id="upgrade" type="button">Upgrade to Pro</button>
        </div>
        <div id="pro-actions" hidden>
          <button id="deactivate" type="button">Remove licence from this browser</button>
        </div>
        <div id="license-status" class="status" role="status"></div>
      </details>
      <details>
        <summary>Settings</summary>
        <label class="check"
          ><input type="checkbox" id="rdap" /> Look up domain age from public RDAP (sends the site name to
          rdap.org)</label
        >
        <p class="fine">Pages are checked on this device. See the privacy notice in the store listing.</p>
      </details>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
